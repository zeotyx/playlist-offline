name: Build AltStore IPA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 https://github.com/flutter/flutter.git refs/tags/3.50.0:refs/tags/3.50.0
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.50.0
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build device IPA
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ vars.JAMENDO_CLIENT_ID }}
        run: bash ./build-altstore-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistOffline-IPA
          path: build/PlaylistOffline.ipa
          if-no-files-found: error
